name: Greek
options:
  bundleIdPrefix: com.greek
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Greek:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GreekApp
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.greek.ios
        PRODUCT_NAME: Greek
        INFOPLIST_FILE: GreekApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
schemes:
  Greek:
    build:
      targets:
        Greek: all
    run:
      config: Debug
    archive:
      config: Release

